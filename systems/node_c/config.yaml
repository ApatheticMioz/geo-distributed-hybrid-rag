# Node C — sparse retrieval + user-facing tier (3-node topology)
#
# Role (decided 2026-09-18, supersedes the old client-only design):
#   * serves the client directly (user-facing FastAPI gateway), and
#   * hosts the Tantivy BM25 sparse index, so the sparse leg — and
#     therefore the SPHP sparse hint — originates one hop closer to the
#     user. The dense leg + RRF fusion stay on Node B; generation stays
#     on Node A behind Node B's existing P2 path.
role: sparse_user_facing
wireguard_ip: "10.8.0.3"

node_b:
  host: "10.8.0.2"          # Node B WireGuard IP — dense + RRF fusion
  port: 8000                # Node B HTTP FastAPI gateway
  # NOTE: the legacy gRPC DenseDispatcher (10.8.0.5:50051) is retired;
  # Node B's retrieval surface is its FastAPI gateway.

node_a:
  host: "10.8.0.1"          # Node A WireGuard IP — vLLM generation host
  grpc_port: 50052          # GenerationOrchestrator gRPC (B -> A leg;
                            # reached from C only transitively via B)

# Tantivy disk-backed BM25 index (sparse leg lives HERE, on C)
corpus:
  tantivy_index_path: "data/tantivy_index"
  raw_corpus_path: "data/documents.jsonl"

# Retrieval parameters
retrieval:
  top_k: 10                 # sparse leg depth at C
  hint_depth: 5             # SPHP sparse-hint depth (subset of top_k)
  # Dense-leg HTTP read timeout (ms) for the C -> B /query/benchmark forward
  # (dense_forward).
  #
  # Current measured Node B dense latency: 21.1-24.3 s, stable across runs.
  # This is a disk-I/O regime (B's Qdrant/BGE-M3 leg is I/O-bound, not
  # compute-bound); the root cause is documented in the GitHub issue being
  # filed, and a warm-fast restoration is pending. Until that lands, the
  # dense leg legitimately takes ~21-24 s per forward.
  #
  # 30,000 ms = measured max ~24.3 s + ~25% headroom (for cold-start
  # variance / GC pauses / WG jitter). The old httpx default (5 s read) sat
  # far below even the warm value, so every real dense forward hit
  # ReadTimeout and the dense leg silently degraded to ([], 0.0).
  dense_timeout_ms: 30000

# User-facing FastAPI gateway (clients talk to C, not to B)
gateway:
  host: "0.0.0.0"
  port: 8000
